# DTAG no-calibration RIGHT PRODUCTION instrument.
# Zero baseline questions: native LSM starts from the empty state.
# 20 adaptive questions and five attention checks. Never ask or infer six
# former pole-calibration items. Existing studies remain untouched.
# PAID PROLIFIC CONFIG TEMPLATE: obtain independent completion codes and investigator approval before deployment.
schema_version: '1'
study_id: dtag-v3-nocal-right-2026-10
model_key: gss/gss_2024
model_release: v0.2.1
reviewed: false  # review consent, eligibility and Prolific completion paths before enabling
consent_version: dtag-v3-nocal-right-2026-10-v1
consent_text: >-
  This research study asks for your views on social and political topics.
  An AI system selects 20 survey questions adaptively, one at a time.
  Answer each in your own words. Your answers are sent to an AI service
  for interpretation and archived for research, together with your Prolific participant ID.
  The study does not ask six preliminary ideology-calibration questions.
  Five attention checks are interleaved; please read each question carefully.
  Participation is voluntary and you may stop at any time. Do not include
  names, contact details or other identifying information in your answers.
  At completion you will receive your Prolific completion code.
initial_steps: 0
intervention_steps: 20
fixed_arm: right
question_mode: llm_required
response_mode: free_text_multi
candidate_mode: native_webapp
push_response_mode: draw
max_response_assignments: 50
minimum_mapping_confidence: 0.8
llm_model: gpt-4.1-mini
prompt_version: dtag-human-v3-evidence-multi-assignments
# All eligible native opinion items remain available. Incomplete GSS battery
# labels are made standalone using source-grounded wording contracts.
excluded_ids: [gunlaw, grass, abany, natfare, natenvir, natarms]
ethics_disallowed_ids: []
prolific:
  required: true  # requires linked Prolific participant
  completion_url: https://app.prolific.com/submissions/complete
  completion_code: CHANGEME00
  # Flagged for potential rejection only under the preregistered IMC and
  # objective-gibberish rules. Configure as Prolific's Failed attention checks
  # path with MANUAL review, not automatic rejection.
  review_code: CHANGEME01
  # In Prolific configure the No consent completion path as 'Request a return'.
  no_consent_code: CHANGEME02
  attention_fail_threshold: 3  # >=3 valid IMCs, or >=2 with independently documented obvious gibberish
  reward: USD 8.00 for 20 adaptive questions + 5 attention checks (confirm duration and payment in Prolific)
quality:
  fast_seconds: 4.0
  short_words: 3
  duplicate_similarity: 0.9
exclude_prior_study_ids:
- prolific-v3-human-opinions-2026-10
- prolific-v3-left-followup-2026-10
- prolific-v3-right-followup-2026-10
- dtag-v3-nocal-left-2026-10
