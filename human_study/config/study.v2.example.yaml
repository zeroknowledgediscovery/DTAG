consent_text: >-
  This is an internal software pilot of adaptive survey questioning.
  Every question is generated by an AI system. Please answer in your own
  words; your written response will be sent to an AI service to interpret
  it into survey categories and stored verbatim for research evaluation.
  Do not include names, contact information, or other identifying details.
  Participation is voluntary. You may stop at any time.
  This internal receipt is not a payment or Prolific code.
