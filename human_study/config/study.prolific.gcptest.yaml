# Google Cloud TEST RUN of the Prolific study (6 baseline + 20 adaptive + 5 checks).
#
# Identical to study.prolific.example.yaml except: its own study_id (test data
# stays separate from real participants), no Prolific ID required, and fixed
# opaque test codes. Three valid IMC failures, or two plus objectively clear
# repeated gibberish, are flagged for potential rejection after investigator verification.
# Declined consent uses a separate Prolific request-return path.
# Never use these codes for recruitment unless matching paths are configured in Prolific.
schema_version: '1'
study_id: prolific-v3-gcp-full-wording-v1
model_key: gss/gss_2024
model_release: v0.2.1
reviewed: true  # TEST ONLY: lets staging start; not an approved instrument
consent_version: prolific-v3-gcp-full-wording-1
consent_text: >-
  This research study asks for your views on social and political topics.
  Questions are written by an AI system, one at a time; please answer each in
  your own words (a sentence or two is enough). Your written answers are sent
  to an AI service to interpret them and are stored for research together with
  your Prolific ID. Do not include names, contact details or other identifying
  information. The study contains a few attention checks; please read every
  question carefully. It takes about 20-25 minutes. Participation is voluntary
  and you may stop at any time by closing this page. When you finish you will
  receive a Prolific completion code.
initial_steps: 6
intervention_steps: 20
question_mode: llm_required
response_mode: free_text_multi
candidate_mode: native_webapp
push_response_mode: draw
max_response_assignments: 50
minimum_mapping_confidence: 0.8
llm_model: gpt-4.1-mini
prompt_version: dtag-human-v3-evidence-multi-assignments
# All eligible native opinion items remain available. Incomplete GSS battery
# labels are made standalone using source-grounded wording contracts.
excluded_ids: []
ethics_disallowed_ids: []
prolific:
  required: false  # open the plain Cloud Run URL; no PROLIFIC_PID needed
  completion_url: https://app.prolific.com/submissions/complete
  completion_code: SS8S8H33L9
  # Flagged for potential rejection only under the preregistered IMC and
  # objective-gibberish rules. Configure as Prolific's Failed attention checks
  # path with MANUAL review, not automatic rejection.
  review_code: NM2HPRMUJK
  # Prolific 'No consent' path must be configured with 'Request a return'.
  no_consent_code: 8AT9344HER
  attention_fail_threshold: 3  # >=3 valid IMCs, or >=2 with independently documented obvious gibberish
  reward: test run, no payment
quality:
  fast_seconds: 4.0
  short_words: 3
  duplicate_similarity: 0.9
attention_checks:
- check_id: attention_token_cobalt
  kind: instructed_token
  render: verbatim
  instruction: "Attention check: To show that you have read this question, include the exact word cobalt in your answer. You may write that word on its own."
  expected_token: cobalt
  after_substantive: 3
  version: prolific-imc-v2
- check_id: attention_token_violet
  kind: instructed_token
  render: verbatim
  instruction: "Attention check: To show that you have read this question, include the exact word violet in your answer. You may write that word on its own."
  expected_token: violet
  after_substantive: 8
  version: prolific-imc-v2
- check_id: attention_token_amber
  kind: instructed_token
  render: verbatim
  instruction: "Attention check: To show that you have read this question, include the exact word amber in your answer. You may write that word on its own."
  expected_token: amber
  after_substantive: 13
  version: prolific-imc-v2
- check_id: attention_token_marble
  kind: instructed_token
  render: verbatim
  instruction: "Attention check: To show that you have read this question, include the exact word marble in your answer. You may write that word on its own."
  expected_token: marble
  after_substantive: 18
  version: prolific-imc-v2
- check_id: attention_token_cedar
  kind: instructed_token
  render: verbatim
  instruction: "Attention check: To show that you have read this question, include the exact word cedar in your answer. You may write that word on its own."
  expected_token: cedar
  after_substantive: 24
  version: prolific-imc-v2
items:
- item_id: gunlaw
  original_wording: Would you favor or oppose a law which would require a person to obtain
    a police permit before he or she could buy a gun?
  choices:
  - native_value: oppose
    display_label: oppose
  - native_value: favor
    display_label: favor
  phase: baseline
  required: false
  version: prolific-draft-1
- item_id: grass
  original_wording: Do you think the use of marijuana should be made legal or not?
  choices:
  - native_value: should not be legal
    display_label: should not be legal
  - native_value: should be legal
    display_label: should be legal
  phase: baseline
  required: false
  version: prolific-draft-1
- item_id: abany
  original_wording: Please tell me whether or not you think it should be possible for a
    pregnant woman to obtain a legal abortion if the woman wants it for any reason?
  choices:
  - native_value: 'no'
    display_label: 'no'
  - native_value: 'yes'
    display_label: 'yes'
  phase: baseline
  required: false
  version: prolific-draft-1
- item_id: natfare
  original_wording: Are we spending too much, too little, or about the right amount on
    welfare?
  choices:
  - native_value: too much
    display_label: too much
  - native_value: about right
    display_label: about right
  - native_value: too little
    display_label: too little
  phase: baseline
  required: false
  version: prolific-draft-1
- item_id: natenvir
  original_wording: Are we spending too much, too little, or about the right amount on
    improving and protecting the environment?
  choices:
  - native_value: too much
    display_label: too much
  - native_value: about right
    display_label: about right
  - native_value: too little
    display_label: too little
  phase: baseline
  required: false
  version: prolific-draft-1
- item_id: natarms
  original_wording: Are we spending too much, too little, or about the right amount on
    the military, armaments, and defense?
  choices:
  - native_value: too little
    display_label: too little
  - native_value: about right
    display_label: about right
  - native_value: too much
    display_label: too much
  phase: baseline
  required: false
  version: prolific-draft-1
