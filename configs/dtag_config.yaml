      - id: NIGERIA
        qnet: afrobarometer_r5
        persona: 35 year old urban male, regular news consumer, politically attentive, moderate
        country: Nigeria
        continent: Africa
      - id: GHANA
        qnet: afrobarometer_r5
        persona: 35 year old urban male, regular news consumer, politically attentive, moderate
        country: Ghana
        continent: Africa
