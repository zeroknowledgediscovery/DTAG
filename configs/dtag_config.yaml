experiments:
  gss2022_divergence:
    description: Native GSS 2022 WF/CM personas on divergence probes.
    map: gss_2022
    question_set: divergence
    outdir: outputs/dtag_gss2022_divergence
    personas:
      - id: WF_US_2022
        qnet: gss_2022
        persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly progressive
        year: 2022
        country: United States
      - id: CM_US_2022
        qnet: gss_2022
        persona: 45 year old white male with children in rural Alabama, regular news consumer, working in farming, veteran, conservative
        year: 2022
        country: United States

  gss2024_master:
    description: Native pooled GSS 2024 on the master question set.
    map: gss_2024
    question_set: master
    outdir: outputs/dtag_gss2024_master
