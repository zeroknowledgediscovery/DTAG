experiments:
  gss2022_divergence:
    description: GSS 2022 WF/CM personas on divergence-probe question sets.
    map: gss_2022
    question_set: divergence
    outdir: outputs/dtag_gss2022_divergence
    personas: &id001
    - id: WF_US_2022
      qnet: gss_2022_female
      persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly
        progressive
      year: 2022
      country: United States
    - id: CM_US_2022
      qnet: gss_2022_male
      persona: 45 year old white male with children in rural Alabama, regular news consumer, working in farming, veteran,
        conservative
      year: 2022
      country: United States
  gss2022_original:
    description: GSS 2022 WF/CM personas on the original question sets.
    map: gss_2022
    question_set: original
    outdir: outputs/dtag_gss2022_original
    personas:
    - id: WF_US_2022
      qnet: gss_2022_female
      persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly
        progressive
      year: 2022
      country: United States
    - id: CM_US_2022
      qnet: gss_2022_male
      persona: 45 year old white male with children in rural Alabama, regular news consumer, working in farming, veteran,
        conservative
      year: 2022
      country: United States
  gss2024_divergence_template:
    description: Template for rerunning the same divergence probes on the pooled 2024 GSS model.
    map: gss_2024
    question_set: divergence
    outdir: outputs/dtag_gss2024_divergence
    personas:
    - id: WF_US_2024
      qnet: gss_2024
      persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly
        progressive
      year: 2024
      country: United States
    - id: CM_US_2024
      qnet: gss_2024
      persona: 45 year old white male with children in rural Alabama, regular news consumer, working in farming, veteran,
        conservative
      year: 2024
      country: United States
  gss2022_master:
    description: 'GSS 2022 WF/CM personas on the combined master question set: renamed original probes plus divergence probes.'
    map: gss_2022
    question_set: master
    outdir: outputs/dtag_gss2022_master
    personas: *id001
  gss2024_master_template:
    description: Template for rerunning the combined master question set on the pooled 2024 GSS model.
    map: gss_2024
    question_set: master
    outdir: outputs/dtag_gss2024_master
    personas:
    - id: WF_US_2024
      qnet: gss_2024
      persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly
        progressive
      year: 2024
      country: United States
    - id: CM_US_2024
      qnet: gss_2024
      persona: 45 year old white male with children in rural Alabama, regular news consumer, working in farming, veteran,
        conservative
      year: 2024
      country: United States
  wvs7_us_india_master_template:
    description: Template for WVS7 pooled model with country/year conditioning. Ideology disabled unless WVS-specific polar
      vectors are supplied.
    map: wvs7
    question_set: master
    outdir: outputs/dtag_wvs7_us_india_master
    polar_vectors: ''
    run:
      no_ideology: true
      resp_mode: max
      semantic_fallback: answer_only
    personas:
    - id: WVS7_US_2017_CM
      qnet: wvs7_pooled
      persona: 45 year old male with children, regular news consumer, working in farming, veteran, conservative
      year: 2017
      country: United States
      continent: North America
    - id: WVS7_India_2017_UM
      qnet: wvs7_pooled
      persona: 35 year old male, urban, college educated, regular news consumer, politically moderate
      year: 2017
      country: India
      continent: Asia
