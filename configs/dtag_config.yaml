# Native-LSM-only DTAG configuration.
#
# Model directories under models/lsm/ are local/runtime artifacts and are not
# committed to Git. Maps may also be generated locally. See README.md.

models:
  gss_2018: models/lsm/gss/gss_2018
  gss_2022: models/lsm/gss/gss_2022
  gss_2024: models/lsm/gss/gss_2024
  wvs7_pooled: models/lsm/wvs/wvs7_pooled
  afrobarometer_r1: models/lsm/afrobarometer/r1
  afrobarometer_r2: models/lsm/afrobarometer/r2
  afrobarometer_r3: models/lsm/afrobarometer/r3
  afrobarometer_r4: models/lsm/afrobarometer/r4
  afrobarometer_r5: models/lsm/afrobarometer/r5
  afrobarometer_r6: models/lsm/afrobarometer/r6
  afrobarometer_r7: models/lsm/afrobarometer/r7
  afrobarometer_r8: models/lsm/afrobarometer/r8
  afrobarometer_r9: models/lsm/afrobarometer/r9

validation_models:
  - gss_2018
  - gss_2022
  - gss_2024
  - wvs7_pooled
  - afrobarometer_r5

maps:
  gss_2018: maps/gss/gss_2018_map.csv
  gss_2022: maps/gss/gss_2022_map.csv
  gss_2024: maps/gss/gss_2024_map.csv
  wvs7: maps/wvs7_variable_question_map.csv
  afrobarometer_r1: maps/afromap/afrobarometer_r1_map.csv
  afrobarometer_r2: maps/afromap/afrobarometer_r2_map.csv
  afrobarometer_r3: maps/afromap/afrobarometer_r3_map.csv
  afrobarometer_r4: maps/afromap/afrobarometer_r4_map.csv
  afrobarometer_r5: maps/afromap/afrobarometer_r5_map.csv
  afrobarometer_r6: maps/afromap/afrobarometer_r6_map.csv
  afrobarometer_r7: maps/afromap/afrobarometer_r7_map.csv
  afrobarometer_r8: maps/afromap/afrobarometer_r8_map.csv
  afrobarometer_r9: maps/afromap/afrobarometer_r9_map.csv

question_sets:
  original:
    dir: assets/question_sets/original
    glob: '*.csv'
  divergence:
    dir: assets/question_sets/divergence
    glob: 'diverge_set_*.csv'
  master:
    dir: assets/question_sets/master
    glob: '*.csv'
  smoke:
    dir: assets/question_sets/smoke
    glob: '*.csv'

defaults:
  polar_vectors: assets/polar_vectors/polar_vectors.csv
  run:
    python: python3
    runs_per_condition: 6
    parallel: 4
    variants: forward,reverse,shuffle
    shuffle_orders: 5
    seed_base: 1000
    state_keep: 500
    k: 50
    prefilter: 200
    min_map_score: 1.0
    semantic_fallback: update_state
    semantic_k: 6
    semantic_prefilter: 80
    semantic_min_confidence: 0.35
    semantic_embedding_model: text-embedding-3-small
    semantic_resp_mode: max
    max_assign: 50
    assign_prefilter: 500
    resp_mode: draw
    openai_model: gpt-4.1-mini
    timing: true
    overwrite: true

interactive_profiles:
  gss2018_wf:
    description: Native pooled GSS 2018; progressive urban female persona.
    map: gss_2018
    qnet: gss_2018
    persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly progressive
    year: 2018
    country: United States
    logs_dir: outputs/interactive_gss2018_wf
    tag: GSS2018_WF
    polar_vectors: assets/polar_vectors/polar_vectors.csv
    run:
      require_polar_vectors: true
      resp_mode: draw

  gss2018_cm:
    description: Native pooled GSS 2018; conservative rural male persona.
    map: gss_2018
    qnet: gss_2018
    persona: 45 year old white male with children in rural Alabama, regular news consumer, working in farming, veteran, conservative
    year: 2018
    country: United States
    logs_dir: outputs/interactive_gss2018_cm
    tag: GSS2018_CM
    polar_vectors: assets/polar_vectors/polar_vectors.csv
