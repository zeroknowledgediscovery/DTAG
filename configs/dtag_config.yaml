models:
  # Legacy Quasinet models retained for A/B validation.
  gss_2022_female: models/gss/gss_2022female.pkl.gz
  gss_2022_male: models/gss/gss_2022male.pkl.gz
  gss_2024: models/gss/gss_2024.gz
  wvs7_pooled: models/wvs/LSM60K.gz
  afrobarometer_r1: models/afrobarometer/LSM_merged_r1_data.gz
  afrobarometer_r2: models/afrobarometer/LSM_merged_r2_data.gz
  afrobarometer_r3: models/afrobarometer/LSM_merged_r3_data.gz
  afrobarometer_r4: models/afrobarometer/LSM_merged_r4_data.gz
  afrobarometer_r5: models/afrobarometer/LSM_merged_r5_data.gz

  # Native LSM development models. These are optional until trained by
  # scripts/train_native_lsm_models.py and are never substituted silently for
  # legacy models.
  gss_2022_female_native: models/lsm/gss/gss_2022_female
  gss_2022_male_native: models/lsm/gss/gss_2022_male
  gss_2024_native: models/lsm/gss/gss_2024
  wvs7_pooled_native: models/lsm/wvs/wvs7_pooled
  afrobarometer_r5_native: models/lsm/afrobarometer/r5

development:
  optional_models:
    - gss_2022_female_native
    - gss_2022_male_native
    - gss_2024_native
    - wvs7_pooled_native
    - afrobarometer_r5_native

maps:
  gss_2016_2020: maps/map20162020.csv
  gss_2022: maps/map2022.csv
  gss_2024: maps/map2024.csv
  wvs7: maps/wvs7_variable_question_map.csv
  afrobarometer_r1: maps/afromap/afrobarometer_r1_map.csv
  afrobarometer_r2: maps/afromap/afrobarometer_r2_map.csv
  afrobarometer_r3: maps/afromap/afrobarometer_r3_map.csv
  afrobarometer_r4: maps/afromap/afrobarometer_r4_map.csv
  afrobarometer_r5: maps/afromap/afrobarometer_r5_map.csv
question_sets:
  original:
    dir: assets/question_sets/original
    glob: '*.csv'
  divergence:
    dir: assets/question_sets/divergence
    glob: diverge_set_*.csv
  all_clean:
    dir: assets/question_sets/master
    glob: '*.csv'
  master:
    dir: assets/question_sets/master
    glob: '*.csv'
defaults:
  pipeline: scripts/pipeline_localized.py
  run_grid: scripts/run_grid.py
  postprocess_script: scripts/postprocess.py
  polar_vectors: assets/polar_vectors/polar_vectors.csv
  run:
    python: python3
    runs_per_condition: 6
    parallel: 4
    variants: forward,reverse,shuffle
    shuffle_orders: 5
    seed_base: 1000
    state_keep: 500
    k: 50
    prefilter: 200
    min_map_score: 1.0
    semantic_fallback: answer_only
    semantic_k: 6
    semantic_prefilter: 80
    semantic_min_confidence: 0.35
    semantic_embedding_model: text-embedding-3-small
    semantic_resp_mode: max
    max_assign: 50
    assign_prefilter: 500
    resp_mode: draw
    openai_model: gpt-4.1-mini
    timing: true
    overwrite: true
  postprocess:
    python: python3
    center_mode: zero
    center: 0.0
    effect_threshold: 0.005
    min_reps: 2
    bootstrap: 2000
    make_plots: true
    quadrant_plot: true
    plot_variant: forward
    quadrant_variant: forward
    plot_ci: 0.95
    plot_dpi: 220
    label_map_csv: assets/label_maps/question_set_interpretive_name_map_master.csv
    pdf: true
    zip_plots: true
    dark: false
    transparent: false
interactive_profiles:
  gss2022_wf:
    description: GSS 2022 progressive urban female profile with GSS polar vectors enabled.
    map: gss_2022
    qnet: gss_2022_female
    persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly
      progressive
    year: 2022
    country: United States
    logs_dir: outputs/interactive_gss2022_wf
    tag: GSS2022_WF_interactive
    polar_vectors: assets/polar_vectors/polar_vectors.csv
    run:
      require_polar_vectors: true
      resp_mode: max
  gss2024_wf:
    description: GSS 2024 pooled-model progressive urban female profile with GSS polar vectors enabled.
    map: gss_2024
    qnet: gss_2024
    persona: 22 year old white female without children in urban New York, regular news consumer, working in retail, highly
      progressive
    year: 2024
    country: United States
    logs_dir: outputs/interactive_gss2024_wf
    tag: GSS2024_WF_interactive
    polar_vectors: assets/polar_vectors/polar_vectors.csv
    run:
      require_polar_vectors: true
      resp_mode: max
  wvs7_india_2017:
    description: WVS7 pooled model localized to India in 2017; ideology disabled.
    map: wvs7
    qnet: wvs7_pooled
    persona: 35 year old male, urban, college educated, regular news consumer, politically moderate
    year: 2017
    country: India
    continent: Asia
    logs_dir: outputs/interactive_wvs7_india_2017
    tag: WVS7_India_2017_interactive
    polar_vectors: ''
    run:
      no_ideology: true
      resp_mode: max
  afrobarometer_r5_nigeria:
    description: Afrobarometer Round 5 localized deterministically to Nigeria; ideology disabled.
    map: afrobarometer_r5
    qnet: afrobarometer_r5
    persona: 35 year old urban male, regular news consumer, politically attentive, moderate
    country: Nigeria
    continent: Africa
