    personas:
      - id: INDIA_2017
        qnet: wvs7_pooled
        persona: 35 year old urban college-educated adult, regular news consumer, politically moderate
        year: 2017
        country: India
        continent: Asia

  afrobarometer_r5_country_pair:
    description: Native Afrobarometer R5 Nigeria/Ghana matched-country experiment.
    map: afrobarometer_r5
    question_set: master
    outdir: outputs/dtag_afrobarometer_r5_country_pair
