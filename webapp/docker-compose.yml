# One container, one port. Models are downloaded once into the named volume.
#   cd webapp && cp .env.example .env   # set OPENAI_API_KEY
#   docker compose up --build
#   open http://localhost:8000
services:
  dtag:
    build:
      context: ..
      dockerfile: webapp/Dockerfile
    image: dtag-web:latest
    ports:
      - "${DTAG_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DTAG_HOST: 0.0.0.0
      DTAG_PORT: "8000"
      DTAG_MODEL_ROOT: /data/models
      DTAG_ASSETS_DIR: /data/assets
      DTAG_WEB_DATA_DIR: /data/webapp
    volumes:
      - dtag-data:/data
    restart: unless-stopped

volumes:
  dtag-data:
