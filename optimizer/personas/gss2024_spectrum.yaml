# Participants for the GSS 2024 optimizer: 12 synthetic personas across the political spectrum.
#
# `state` pins each participant's starting survey state with GSS 2024 labels, so runs are exact
# and need no LLM. `text` is the matching description: with participants.decode: always (or by
# removing `state`), the LLM decodes it through DTAG's own persona decoding instead.
# Direction (should move up or down) comes from the sign of each participant's starting ideology.
participants:
  - id: cm_rural_alabama
    text: >-
      45-year-old white man living in open country outside a small town in rural Alabama, in the South.
      He is married and has two children. He works full time in farming. He is a veteran who served
      2 to 4 years of active duty in the armed forces. He reads a newspaper every day. His education
      ended with a high school diploma. He thinks of himself as conservative and is a strong Republican.
      He is Protestant and attends religious services every week.
    state: {sex: male, age: "45.0", race: white, region: south, childs: "2.0",
            xnorcsiz: "open country within larger civil divisions (division, township, etc.)",
            news: every day, wrkstat: working full time, vetyears: "yes, 2-4 years", polviews: conservative,
            partyid: strong republican, relig: protestant, attend: every week, marital: married, degree: high school}

