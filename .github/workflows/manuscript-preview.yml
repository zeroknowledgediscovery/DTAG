name: Compile DTAG integrated publication figures and manuscript
# Final axis-scale verification of consolidated figure floats; no native simulation

on:
  push:
    branches: [experiment-integrated-10q]
    paths:
      - .github/workflows/manuscript-preview.yml
      - tex/**
      - experiments/persona_push/NATIVE_RESULTS_SECTION.tex
      - experiments/persona_push/publication_pgfplots.py
      - experiments/persona_push/data/figures/fig*pgfplots.tex
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-pgfplots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies (no native model)
        run: python -m pip install numpy pandas pyyaml pymupdf
      - name: Regenerate all publication plots from archived ORIGINAL data
        run: |
          python experiments/persona_push/archive_historical.py --plot
          rsync -av experiments/persona_push/runs/historical_q10_r40/figures/ experiments/persona_push/data/figures/
          python -m py_compile experiments/persona_push/publication_pgfplots.py
          test -f experiments/persona_push/data/figures/fig1_endpoints_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig2_trajectories_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig3_heatmaps_all_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig4_order_effects_all_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig5_sign_reversal_probabilities_pgfplots.tex
      - name: Compile stand-alone figure previews and journal manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            figures_preview.tex
            main.tex
          working_directory: tex
          args: -pdf -interaction=nonstopmode -file-line-error -halt-on-error
      - name: Verify figure proof pagination and manuscript supplement
        run: |
          python - <<'PY'
          import fitz
          preview = fitz.open("tex/figures_preview.pdf")
          headings = ("Figure A:", "Figure B:", "Figure C:", "Supplementary comparison:")
          assert len(preview) == 4, f"Expected 4 figure-proof pages, got {len(preview)}"
          for page_num, heading in enumerate(headings):
              text = preview[page_num].get_text()
              assert heading in text, f"Missing {heading} on proof page {page_num + 1}"
              assert len(text.strip()) > 125, f"Suspected blank proof page {page_num + 1}"
              print(f"Figure proof page {page_num + 1}: {heading} ({len(text)} extracted characters)")
          heatmap = preview[1].get_text()
          for term in ("Right push", "Left push", "Neutral", "Alabama", "Atlanta"):
              assert term in heatmap, f"Missing heatmap label {term}"
          paper = fitz.open("tex/main.pdf")
          paper_text = "\\n".join(page.get_text() for page in paper)
          assert "S1" in paper_text, "Supplementary figure must use S1 numbering"
          assert "Globally optimized question-identity heatmaps" in paper_text
          assert "Fixed-ten-question order effects" in paper_text
          print(f"Manuscript: {len(paper)} pages; all principal and supplementary figure captions present")
          PY
      - name: Upload PDFs and publication figure input files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtag-consolidated-pgfplots-and-manuscript
          path: |
            tex/figures_preview.pdf
            tex/main.pdf
            experiments/persona_push/data/figures/fig*pgfplots.tex
            experiments/persona_push/data/figures/pub_sign_reversal_probabilities.csv
          if-no-files-found: warn
