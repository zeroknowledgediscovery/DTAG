name: Compile DTAG integrated publication figures and manuscript
# Rebuild with corrected native-results LaTeX captions and final legibility styling

on:
  push:
    branches: [experiment-integrated-10q]
    paths: [.github/workflows/manuscript-preview.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publication-pgfplots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install analysis dependencies (no native model)
        run: python -m pip install numpy pandas pyyaml
      - name: Regenerate all publication plots from archived ORIGINAL data
        run: |
          python experiments/persona_push/archive_historical.py --plot
          rsync -av experiments/persona_push/runs/historical_q10_r40/figures/ experiments/persona_push/data/figures/
          python -m py_compile experiments/persona_push/publication_pgfplots.py
          test -f experiments/persona_push/data/figures/fig1_endpoints_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig2_trajectories_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig3a_heatmaps_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig3b_heatmaps_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig4a_order_effects_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig4b_order_effects_pgfplots.tex
          test -f experiments/persona_push/data/figures/fig5_sign_reversal_probabilities_pgfplots.tex
      - name: Commit reproducible PGFPlots sources and input CSVs
        run: |
          git config user.name 'DTAG publication builder'
          git config user.email 'actions@users.noreply.github.com'
          git add -f experiments/persona_push/data/figures/
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate five publication figure groups from archived 10q/40r observations'
            git push origin HEAD:experiment-integrated-10q
          fi
      - name: Compile stand-alone figure previews and journal manuscript
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            figures_preview.tex
            main.tex
          working_directory: tex
          args: -pdf -interaction=nonstopmode -file-line-error -halt-on-error
      - name: Upload PDFs and publication figure input files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dtag-five-pgfplots-figures-and-manuscript
          path: |
            tex/figures_preview.pdf
            tex/main.pdf
            experiments/persona_push/data/figures/fig*pgfplots.tex
            experiments/persona_push/data/figures/pub_sign_reversal_probabilities.csv
          if-no-files-found: warn
