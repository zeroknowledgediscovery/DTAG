name: DTAG persona-push smoke results

on:
  push:
    branches: [dev]
    paths:
      - 'scripts/dtag_persona_push_study.py'
      - 'optimizer/one_step_geometry.py'
      - '.github/workflows/persona-push-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DTAG_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: |
          python -m pip install -r requirements.txt
      - name: Build native LSM
        run: bash scripts/build_native_bindings.sh
      - name: Run native study smoke
        run: |
          python scripts/dtag_persona_push_study.py \
            --quick --workers 2 --bootstrap 2000 \
            --out outputs/dtag_persona_push/ci_smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persona-push-smoke
          path: outputs/dtag_persona_push/ci_smoke/
          if-no-files-found: warn
