name: Complete GSS 2024 Native Wording Inventory

on:
  workflow_dispatch:
  push:
    branches: [experiment/prolific-human-study]
    paths:
      - "human_study/scripts/audit_all_native_gss_2024.py"
      - ".github/workflows/audit-gss2024-full-native.yml"

jobs:
  audit-811:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: \${{ github.workspace }}/human_study/backend:\${{ github.workspace }}/human_study/scripts:\${{ github.workspace }}/scripts:\${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install documentation and native-source dependencies
        run: python -m pip install -r human_study/requirements.txt pdfplumber
      - name: Install full native 2024 GSS model and verify source-map inventory
        run: python scripts/fetch_models.py gss/gss_2024
      - name: Retrieve original 2024 GSS release-2 codebook
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            --max-time 240 \
            'https://gss.norc.org/content/dam/gss/get-documentation/pdf/codebook/GSS%202024%20Codebook%20R2.pdf' \
            --output "$RUNNER_TEMP/gss2024_codebook_r2.pdf"
          test "$(wc -c < "$RUNNER_TEMP/gss2024_codebook_r2.pdf")" -gt 100000
      - name: Audit every model feature, map label, native value and codebook entry
        run: |
          python human_study/scripts/audit_all_native_gss_2024.py \
            --codebook "$RUNNER_TEMP/gss2024_codebook_r2.pdf" \
            --out "$RUNNER_TEMP/gss2024_full_wording_audit"
      - name: Upload complete per-variable audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gss2024-811-native-variable-audit
          path: |
            \${{ runner.temp }}/gss2024_full_wording_audit.csv
            \${{ runner.temp }}/gss2024_full_wording_audit.json
          if-no-files-found: warn
          retention-days: 30
