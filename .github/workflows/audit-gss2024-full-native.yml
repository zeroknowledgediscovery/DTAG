name: Complete GSS 2024 Native Wording Inventory

on:
  workflow_dispatch:
  push:
    branches: [experiment/prolific-human-study]
    paths:
      - "human_study/scripts/audit_all_native_gss_2024.py"
      - "human_study/scripts/build_gss2024_source_catalog.py"
      - "human_study/backend/human_study/wording_contracts.py"
      - ".github/workflows/audit-gss2024-full-native.yml"

permissions:
  contents: write

concurrency:
  group: full-gss2024-source-catalog
  cancel-in-progress: false

jobs:
  audit-811:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/human_study/backend:${{ github.workspace }}/human_study/scripts:${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install documentation and native-source dependencies
        run: python -m pip install -r human_study/requirements.txt pdfplumber
      - name: Install full native 2024 GSS model and verify source-map inventory
        run: python scripts/fetch_models.py gss/gss_2024
      - name: Retrieve original 2024 GSS release-2 codebook
        run: |
          curl --fail --location --retry 3 --retry-delay 3 \
            --max-time 240 \
            'https://gss.norc.org/content/dam/gss/get-documentation/pdf/codebook/GSS%202024%20Codebook%20R2.pdf' \
            --output "$RUNNER_TEMP/gss2024_codebook_r2.pdf"
          test "$(wc -c < "$RUNNER_TEMP/gss2024_codebook_r2.pdf")" -gt 100000
      - name: Audit every model feature, map label, native value and codebook entry
        run: |
          python human_study/scripts/audit_all_native_gss_2024.py \
            --codebook "$RUNNER_TEMP/gss2024_codebook_r2.pdf" \
            --out "$RUNNER_TEMP/gss2024_full_wording_audit"
      - name: Build release-pinned offline GSS source prompt catalog
        run: |
          python human_study/scripts/build_gss2024_source_catalog.py \
            "$RUNNER_TEMP/gss2024_full_wording_audit.json"
          python - <<'PY'
          import json
          d=json.load(open("human_study/data/gss_2024_r2_source_context.json"))
          assert len(d["variables"]) >= 750
          print("Source labels packaged:",len(d["variables"]))
          PY
      - name: Commit source-context snapshot for deterministic production prompts
        if: github.ref == 'refs/heads/experiment/prolific-human-study'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human_study/data/gss_2024_r2_source_context.json
          if ! git diff --cached --quiet; then
            git commit -m "data(human-study): pin GSS 2024 R2 source-label context to 811-variable model"
            # This branch may have advanced while the official codebook was
            # being parsed. Rebase the data-only commit, never force-push.
            git fetch origin experiment/prolific-human-study
            git rebase FETCH_HEAD
            git push origin HEAD:experiment/prolific-human-study
          fi
      - name: Upload complete per-variable audit inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gss2024-811-native-variable-audit
          path: |
            ${{ runner.temp }}/gss2024_full_wording_audit.csv
            ${{ runner.temp }}/gss2024_full_wording_audit.json
          if-no-files-found: warn
          retention-days: 30
