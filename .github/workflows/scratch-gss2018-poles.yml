name: GSS 2018 scratch pole experiment

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/scratch-gss2018-poles.yml
      - scratch/gss2018_pole_geometry/derive_stratified_poles.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-stratified-2018-poles:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install DTAG model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Construct partyid-conditioned 2018 pole and test heldout polviews order
        run: |
          python scratch/gss2018_pole_geometry/derive_stratified_poles.py \
            --stratify partyid --left "strong democrat" \
            --right "strong republican" --pool canonical --skip-loo
          echo "=== SCRATCH REPORT ==="
          cat scratch/gss2018_pole_geometry/results/model_stratified_partyid/REPORT.md
      - name: Preserve generated 2018 pole and full diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gss2018-partyid-pole-experiment
          path: scratch/gss2018_pole_geometry/results/model_stratified_partyid/
          if-no-files-found: warn
