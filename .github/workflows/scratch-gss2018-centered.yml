name: GSS 2018 empty-centered fixed-sequence probe

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/scratch-gss2018-centered.yml
      - scratch/gss2018_pole_geometry/test_empty_centering.py
      - optimizer/ideology_coordinates.py
      - optimizer/four_way_audit.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  centered-2018-fixed-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
      - name: Native descriptive A/B experiment on one fixed, seeded neutral sequence
        run: |
          python scratch/gss2018_pole_geometry/test_empty_centering.py \
            --states 12 --draws 6 --workers 2 --bootstrap 1500
          cat scratch/gss2018_pole_geometry/results/centered_2018_fixed_probe/REPORT.md
      - name: Preserve raw and centered trajectories, metadata and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gss2018-fixed-sequence-centered-vs-raw
          path: scratch/gss2018_pole_geometry/results/centered_2018_fixed_probe/
          if-no-files-found: warn
